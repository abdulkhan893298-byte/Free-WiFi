<html>
  <head>
    <title>
      Faaa
    </title>
    <style>
      html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    </style>
  </head>
  <body>
    <img src="image.png" alt="">
      <audio id="audio" autoplay loop>
    <source src="audio.mp3" type="audio/mpeg">
  </audio>
  </body>
  <script>
    const audio = document.getElementById("audio");

    // Browser autoplay block kare to first tap/click par audio start hoga.
    window.addEventListener("click", () => {
      audio.play().catch(() => {});
    }, { once: true });

    window.addEventListener("touchstart", () => {
      audio.play().catch(() => {});
    }, { once: true });
  </script>
  
</html>
